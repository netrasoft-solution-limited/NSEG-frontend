<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Animation Landing Page</title>
    <script>
      (function () {
        try {
          // The brand default is dark (matches the CorridorMap hero art);
          // light mode is opt-in only, via the toggle, and then remembered.
          if (localStorage.getItem('nseg-theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
